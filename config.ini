[Application]
; Configuration file for Bybit Data Fetcher
; Edit these values to change default settings

[Defaults]
; Default trading pair (e.g., BTCUSDT, ETHUSDT)
DefaultSymbol=BTCUSDT

; Default market type (spot or linear)
DefaultMarket=spot

; Default timeframe (1m,5m,15m,30m,1h,4h,1d,1w,1M)
DefaultTimeframe=1h

; Default number of days to fetch when "Last X days" is clicked
DefaultDaysBack=30

[Indicators]
; Technical indicators to calculate (true/false)
RSI=true
ADX=true
EMA21=true
EMA50=true
MACD=false
BollingerBands=false

[API]
; Bybit API settings
; Set to true for testnet, false for mainnet
Testnet=false

; Number of retry attempts on failed requests
MaxRetries=3

; Delay between retries in seconds
RetryDelay=1

; Delay between API batches in seconds
BatchDelay=0.2

[Logging]
; Logging level (ERROR, INFO, DEBUG)
LogLevel=ERROR

; Maximum log file size in MB before rotation
MaxLogSizeMB=10

; Number of backup log files to keep
MaxBackupFiles=4